---
---
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e4">
  <title>{{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/kkamang-donghwa.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/home.css' | relative_url }}">
</head>
<body>
  <header class="site-header shell">
    <img class="site-mark" src="{{ '/assets/kkamang-donghwa.png' | relative_url }}" alt="" width="52" height="52">
    <h1>{{ site.title | escape }}</h1>
  </header>

  <main class="shell">
    <p class="introduction">그림과 함께 읽는 창작 동화를 이곳에 모았어요.</p>

    <section aria-labelledby="story-list-title">
      <h2 id="story-list-title">동화 목록</h2>
      {% if site.books.size > 0 %}
        <ul class="story-list">
          {% for book in site.books %}
            <li>
              <a href="{{ book.url | relative_url }}">{{ book.title | escape }}</a>
              <span class="story-author">이야기 창작 · {{ book.author | escape }}</span>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>아직 공개된 동화가 없어요.</p>
      {% endif %}
    </section>
  </main>
</body>
</html>
